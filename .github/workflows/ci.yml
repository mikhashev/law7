name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (MCP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # The tsc/vitest gate scripts below (scripts/tools/ci/check_tsc.py,
      # check_vitest.py) are stdlib-only Python; this job doesn't need the
      # project's uv-managed environment, just an interpreter on PATH.
      - name: Install Python (for CI gate scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # `tsc` still emits dist/ even when it exits non-zero, so build and
      # gating are separate steps: this one produces dist/ and is allowed to
      # fail here, and check_tsc.py decides whether the failure is new.
      - name: Build
        run: npx tsc -p .
        continue-on-error: true

      # Fails only on a tsc error outside the known files listed under
      # [tsc-files] in src/test/known_failures.txt, or on a count above the
      # recorded baseline -- and outright if the running tsc version
      # doesn't match that section's recorded version=. See
      # scripts/tools/ci/README.md.
      - name: Check build (tsc)
        run: python scripts/tools/ci/check_tsc.py

      # Same pattern as Build: this step surfaces normal vitest output and
      # is allowed to fail; check_vitest.py makes the actual pass/fail call.
      - name: Test
        run: npm test
        continue-on-error: true

      # Fails only on a vitest failure not listed in src/test/known_failures.txt,
      # and outright if the running vitest version doesn't match [vitest]'s
      # recorded version=. See scripts/tools/ci/README.md.
      - name: Check test (vitest)
        run: python scripts/tools/ci/check_vitest.py

  python:
    name: Python (data pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # uv.lock pins torch to the explicit pytorch-cu128 index (see
      # [tool.uv.sources] in pyproject.toml), so a plain `uv sync --frozen`
      # would download a ~2.5 GB CUDA wheel. UV_TORCH_BACKEND only affects
      # resolution, and cannot override an explicitly pinned index inside a
      # frozen lock, so instead we sync everything except torch and install a
      # CPU wheel on top. UV_NO_SYNC keeps later `uv run` calls from
      # re-syncing (which would pull the CUDA wheel back in).
      - name: Sync dependencies (without torch)
        run: uv sync --frozen --no-install-package torch

      - name: Install CPU-only torch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Surfaces normal ruff output; the actual pass/fail call is made by
      # check_ruff.py below.
      - name: Ruff
        run: uv run --no-sync ruff check scripts/
        continue-on-error: true

      # Fails only if the total finding count exceeds the recorded baseline
      # under [ruff] in scripts/test/known_failures.txt, and outright if
      # the running ruff version doesn't match that section's recorded
      # version=. See scripts/tools/ci/README.md.
      - name: Check lint (ruff)
        run: uv run --no-sync python scripts/tools/ci/check_ruff.py

      # Surfaces normal pytest output; the actual pass/fail call is made by
      # check_pytest.py below.
      - name: Pytest
        run: uv run --no-sync pytest -q
        continue-on-error: true

      # Fails only on a failing/erroring test not listed in
      # scripts/test/known_failures.txt, and outright if the running
      # pytest version doesn't match [pytest]'s recorded version=.
      - name: Check tests (pytest)
        run: uv run --no-sync python scripts/tools/ci/check_pytest.py
