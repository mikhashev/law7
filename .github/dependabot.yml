version: 2

# Policy set 2026-09-14: semver-major bumps are adopted deliberately, not
# automatically.
# A major version can change a dependency's behavior (breaking API changes)
# or, for our dev-tooling deps (ruff, black, typescript), make the tool
# itself stricter -- more lint rules enabled, new compiler diagnostics --
# which inflates the CI gate baselines in scripts/tools/ci/ with no code
# change at all (see scripts/tools/ci/README.md). So Dependabot is told to
# skip semver-major *version* updates here (security updates are not
# affected -- see (a) below); a maintainer bumps a major manually, one
# dependency per commit, re-measuring and updating the relevant
# known_failures.txt baseline (with its recorded tool `version=`) in that
# same commit. Minor/patch updates continue to flow through Dependabot as
# before.
#
# What this policy does NOT do -- measured on this repo, not inferred from
# the docs:
#
# (a) It does not apply to SECURITY updates. Dependabot's own updater log
#     says so, verbatim, in the job "Dependabot Updates uv in /. for pillow"
#     (a *security* update job, pillow 11.3.0 -> 12.3.0), measured
#     2026-09-14 16:32 UTC in run
#     github.com/mikhashev/law7/actions/runs/34869196755:
#       Ignored versions: version-update:semver-major - from
#       .github/dependabot.yml (doesn't apply to security update)
#     An earlier version of this comment claimed the opposite, reading the
#     shield icon in the options reference ("All options marked with a
#     [shield-check] icon also change how Dependabot creates pull requests
#     for security updates") as covering `update-types` under `ignore`. That
#     reading was ambiguous -- the icon marks the `ignore` option as a whole,
#     and the same page's prose about ignoring dependencies does not
#     separate the `versions` and `update-types` forms -- and the log wins
#     over the reading. So: a semver-major *security* fix WILL arrive here as
#     an automated PR, and must be reviewed like any other major -- one
#     dependency per commit, and if it is a dev tool (ruff, black,
#     typescript, pytest, vitest), re-measure the CI gate baselines in that
#     same commit.
#     Confirming the same run: the security-flagged major PRs #45 (black
#     24.10.0 -> 26.3.1) and #46 (setuptools 81 -> 83) stayed open under this
#     rule.
#
# (b) It closes matching PRs that are already open. On the first Dependabot
#     run after this ignore rule was pushed, Dependabot itself closed the 8
#     open semver-major *version-update* PRs -- #34 #35 #36 #38 #39 #40 #42
#     #44, closed 16:31:54-57 UTC on 2026-09-14 by app/dependabot. An ignore
#     rule is therefore retroactive, not just a filter on future runs: adding
#     one discards the review work already sitting in those PRs.
#
# It is also not a way to stay on an old major: alerts are still raised, and
# a major we choose not to take is a decision to record, not a default to
# drift into.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # uv projects are covered by the "uv" ecosystem (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
